spring:
  application:
    name: be
  datasource:
    url: "jdbc:mysql://localhost:3306/truongtho"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 20
    show-sql: true
  h2:
    console:
      enabled: false
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: "truongtho"
    public-url: "https://pub-4366456f369044dbb0498de7f2f9bb44.r2.dev"
    endpoint: "https://f9363626e0a27c343b7bb5f133afdba7.r2.cloudflarestorage.com"


app:
  upload:
    max-size: 5MB
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp

  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_MINUTES:900000}
    refresh-expiration-days: ${JWT_REFRESH_DAYS:7}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/oauth2/callback/google}


  sepay:
    api-key: ${SEPAY_WEBHOOK_API_KEY}
#    account-number: ${SEPAY_ACCOUNT_NUMBER}
#    bank: ${SEPAY_BANK}
    account-number: "0000000002"
    bank: "MBBank"

server:
  port: ${SERVER_PORT:8081}


