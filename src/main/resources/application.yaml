spring:
  application:
    name: be
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
      default_batch_fetch_size: 20
    show-sql: true
  h2:
    console:
      enabled: false
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: "truongtho"
    public-url: ${R2_PUBLIC_URL}
    endpoint: ${R2_ENDPOINT}


app:
  upload:
    max-size: 5MB
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp

  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_DAYS:7}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  cookie:
    secure: ${COOKIE_SECURE:false}
    path: ${COOKIE_PATH:/api/v1/auth}



server:
  port: ${SERVER_PORT:8081}