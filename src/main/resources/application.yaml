spring:
  application:
    name: be
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
            model: ${GEMINI_CHAT_MODEL}
            tempature: ${GEMINI_CHAT_TEMPERATURE}
        embedding:
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL}
              dimensions: 1536
          api-key: ${GEMINI_API_KEY}
    vectorstore:
      pgvector:
        dimensions: 1536
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine_distance
cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}
    endpoint: ${R2_ENDPOINT}


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  upload:
    max-size: 5MB
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp

  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_DAYS:7}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-url: ${GOOGLE_REDIRECT_URI}
  cookie:
    secure: ${COOKIE_SECURE:false}
    path: ${COOKIE_PATH:/api/v1/auth}

  sepay:
    api-key: ${SEPAY_WEBHOOK_API_KEY}
    account-number: ${SEPAY_ACCOUNT_NUMBER}
    bank: ${SEPAY_BANK}

  restaurant:
    name: Trường Thọ
    address: "Địa chỉ thật của nhà hàng"
    opening-hours: "08:00–22:00"
    phone: "0918 123 456"
    intro: "Nhà hàng món Việt, không gian gia đình, có đặt bàn trước."
server:
  port: ${SERVER_PORT}
  forward-headers-strategy: native




logging:
  level:
    org.flywaydb: DEBUG